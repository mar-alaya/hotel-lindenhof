    <style type="text/tailwindcss">
      @theme {
        --color-primary: #193d32;
        --color-secondary: #38634b;
        --color-bg: #f7f5ef;
        --color-accent: #b99670;

                </li>

            <a href="index.html"

            <ul

              </li>
              <li><a href="rooms.html" target="_blank">Rooms</a></li>
              <li><a href="restaurant.html" target="_blank">Restaurant</a></li>

            </ul>
          </div>
          <div class="navbar-end">
            <a
              href="booking.html"
              target="_blank"
              class="btn btn-main btn-lg hidden lg:flex"
              >BOOK NOW</a
            >
          </div>
        </div>
      </nav>
      <div
        class="hero min-h-[50vh] w-full justify-start px-5 sm:px-10 md:px-20"
      >
        <div class="max-w-lg">
          <h1
            class="mb-8 font-display text-4xl leading-tight font-medium tracking-wide text-[#F7F5EF] text-shadow-lg sm:text-5xl md:text-6xl lg:text-7xl lg:leading-18"
          >
            Activities in the
            <span class="tracking-wide italic font-bold">Mountains</span>
          </h1>
        </div>
      </div>
    </header>
    <main class="bg-bg">
      <div class="flex flex-col lg:py-10 lg:px-20 p-10">
        <p
          class="mb-3 text-xs font-bold uppercase tracking-[.18em] text-accent"
        >
          Outdoor Activities
        </p>
        <h2 class="mt-3 font-serif text-4xl leading-tight md:text-5xl">
          There's something for every pace
        </h2>
      </div>
      <div class="lg:pl-20 lg:mb-10 p-10">
        <select id="filter-season" class="select">
          <option selected value="All">All Seasons</option>
          <option value="Summer">Summer</option>
          <option value="Winter">Winter</option>
        </select>

        <select id="filter-difficulty" class="select">
          <option selected value="All">All Levels</option>
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
        </select>
      </div>

      <div

        class="flex flex-wrap items-center justify-center gap-5 lg:p-20"
