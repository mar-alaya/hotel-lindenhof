<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" href="./styles/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="https://unpkg.com/cally"></script>
    <script src="/hotel-lindenhof/index.js" defer></script>
    <title>Hotel Lindenhof</title>
  </head>
  <body>
    <header class="bg-[url(./assets/hero.jpg)] bg-cover bg-center">
      <nav>
        <div class="navbar p-5">
          <div class="navbar-start">
            <div class="dropdown">
              <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                <svg
                  aria-label="Menu"
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 6h16M4 12h8m-8 6h16"
                  />
                </svg>
              </div>
              <ul
                tabindex="-1"
                class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow"
              >
                <li><a>Hotel</a></li>
                <li><a>Rooms</a></li>
                <li><a>Blog</a></li>
              </ul>
            </div>
            <a href="index.html"
              ><img src="./assets/logo.png" class="lg:h-20 h-5"
            /></a>
          </div>
          <div class="navbar-center hidden lg:flex">
            <ul
              class="menu menu-horizontal px-1 text-white font-semibold uppercase"
            >
              <li><a>Activities</a></li>
              <li><a>Rooms</a></li>
              <li><a>Blog</a></li>
            </ul>
          </div>
          <div class="navbar-end">
            <a href="booking.html" class="btn btn-main">BOOK NOW</a>
          </div>
        </div>
      </nav>
      <div
        class="hero min-h-[80vh] hero-content text-neutral-content justify-start w-full px-10 md:px-20"
      >
        <div class="max-w-md">
          <h1 class="mb-5 text-7xl font-bold text-[#F7F5EF] text-shadow-lg">
            Where the mountains feel like
            <span class="italic tracking-wide text-[#193D32] text-shadow-lg"
              >home</span
            >
          </h1>
          <button class="btn btn-lg btn-main">
            <a href="booking.html">Book now</a>
          </button>
          <button class="btn btn-lg btn-secondary">Check Activities</button>
        </div>
      </div>
    </header>
    <main></main>
  </body>
</html>
