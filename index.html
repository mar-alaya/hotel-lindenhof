<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="https://unpkg.com/cally"></script>
    <script src="/hotel-lindenhof/index.js" defer></script>
    <title>Hotel Lindenhof</title>
  </head>
  <body>
    <header>
      <nav>
        <div class="navbar bg-base-100 shadow-sm">
          <div class="navbar-start">
            <div class="dropdown">
              <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                <svg
                  aria-label="Menu"
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 6h16M4 12h8m-8 6h16"
                  />
                </svg>
              </div>
              <ul
                tabindex="-1"
                class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow"
              >
                <li><a>Hotel</a></li>
                <li><a>Zimmer</a></li>
                <li><a>Kontakt</a></li>
              </ul>
            </div>
            <a class="btn btn-ghost text-xl">Hotel Lindenhof</a>
          </div>
          <div class="navbar-center hidden lg:flex">
            <ul class="menu menu-horizontal px-1">
              <li><a>Hotel</a></li>
              <li><a>Rooms</a></li>
              <li><a>Contact</a></li>
            </ul>
          </div>
          <div class="navbar-end">
            <a class="btn">Book now</a>
          </div>
        </div>
      </nav>

      <section class="section-header">
        <div
          class="hero min-h-screen"
          style="
            background-image: url(https://img.daisyui.com/images/stock/photo-1507358522600-9f71e620c44e.webp);
          "
        >
          <div class="hero-overlay"></div>
          <div class="hero-content text-neutral-content text-center">
            <div class="max-w-md">
              <h1 class="mb-5 text-5xl font-bold">
                More than a place to sleep
              </h1>
              <p class="mb-5">
                Erlebe exklusiven Komfort und unvergessliche Momente im Herzen
                der Stadt.
              </p>
              <a class="btn btn-primary" href="#section-buchung"
                >Jetzt buchen</a
              >
            </div>
          </div>
        </div>
      </section>
    </header>
    <main>
      
    </main>
  </body>
</html>
